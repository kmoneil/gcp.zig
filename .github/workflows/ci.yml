name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_iterations:
        description: "Also run the fuzz job for this many iterations, such as 20K or 2M"
        default: ""
  schedule:
    # Nightly: a longer coverage-guided fuzzing run.
    - cron: "17 3 * * *"

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to a pull request supersedes its older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Format
        run: zig build fmt

      # Every relative link and anchor in the Markdown resolves, and the
      # code the docs copy from examples/ and tests/ is that code.
      - name: Docs
        run: python3 tools/check_docs.py

      # tools/await_pr.py waits on a pull request and checks that what
      # merged is what CI tested; tools/discovery_drift.py says what
      # changed between two discovery documents. Each on canned inputs.
      - name: Tools
        run: |
          python3 -I tools/await_pr.py --self-test
          python3 -I tools/discovery_drift.py --self-test

      # zigvet and gnarl, pinned releases, which `zig build test` runs: a
      # zigvet finding, or a function newly over its complexity limit,
      # fails the build as a failing test does.
      - uses: ./.github/actions/vet-tools

      - name: Unit, property and fuzz-corpus tests
        run: zig build test --summary all

      # core.crc32c runs the CPU's CRC32C instructions where the build's CPU
      # has them, as this runner's does, and tables everywhere else. A
      # baseline x86_64 has none: the tables' build, and proof that no
      # instruction leaks into it.
      - name: Core unit tests on a baseline CPU
        run: zig build test -Dmodule=core -Dcpu=baseline --summary all

      # One network for both emulators, so fake-gcs-server can publish a
      # bucket's notifications to the Pub/Sub emulator by its name.
      - name: Start the Pub/Sub emulator
        run: |
          docker network create emulators
          # host-gateway: the push delivery test runs a listener on the
          # runner, which the emulator reaches only through the host.
          docker run -d --name pubsub --network emulators -p 8085:8085 \
            --add-host=host.docker.internal:host-gateway \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --project=test --host-port=0.0.0.0:8085
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:8085/ >/dev/null && exit 0
            sleep 2
          done
          docker logs pubsub
          exit 1

      # The Firestore emulator ships in the same image as Pub/Sub's.
      - name: Start the Firestore emulator
        run: |
          docker run -d --name firestore -p 8087:8087 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8087
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:8087/ >/dev/null && exit 0
            sleep 2
          done
          docker logs firestore
          exit 1

      - name: Start fake-gcs-server
        run: |
          # -public-host: the emulator serves the XML API's paths, which
          # signed URLs use, only to requests for this host. -backend
          # memory: the one backend that keeps object versions (the image's
          # default, filesystem, answers a versioned bucket with 500), and
          # what local runs use. Pinned, so a release cannot change CI's
          # answers unseen.
          docker run -d --name fake-gcs --network emulators -p 4443:4443 \
            -e PUBSUB_EMULATOR_HOST=pubsub:8085 \
            fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef \
            -backend memory -scheme http -port 4443 -public-host 127.0.0.1:4443
          for _ in $(seq 1 30); do
            curl -sf "http://127.0.0.1:4443/storage/v1/b?project=test" >/dev/null && exit 0
            sleep 2
          done
          docker logs fake-gcs
          exit 1

      # About a minute normally. A suite that hangs fails here in ten rather
      # than using up the job's thirty, and the build streams each test's
      # name as it starts, so the log's last line names the one that hung.
      - name: Integration tests
        timeout-minutes: 10
        env:
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8085
          PUBSUB_TEST_PUSH_HOST: host.docker.internal
          STORAGE_EMULATOR_HOST: http://127.0.0.1:4443
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8087
        run: zig build test-integration --summary all

      # FakeFirestore, which the unit tests run against, held to the
      # emulator: hundreds of random queries and aggregations, answered
      # alike or refused alike. A failure prints its seed;
      # FIRESTORE_DIFF_SEED replays it.
      - name: Firestore fake against the emulator
        timeout-minutes: 10
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8087
        run: zig build test -Dmodule=firestore "-Dtest-filter=emulator differential" --summary all

      # The in-memory Pub/Sub, which callers' own tests can run against,
      # held to the emulator: random scripts of calls to both, answered
      # alike or refused alike, over what the emulator and production
      # were measured to agree on. A failure prints its seed and its
      # script; PUBSUB_DIFF_SEED replays it.
      - name: Pub/Sub fake against the emulator
        timeout-minutes: 10
        env:
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8085
        run: zig build test -Dmodule=pubsub "-Dtest-filter=emulator differential" --summary all

      - name: Examples
        timeout-minutes: 10
        env:
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8085
          STORAGE_EMULATOR_HOST: http://127.0.0.1:4443
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8087
        run: |
          zig build example-worker
          zig build example-publish -- orders 3
          zig build example-publisher -- orders 500 4
          zig build example-worker
          # Acked from the handler, which prints what the server said. At
          # least the two: the emulator can hold a fresh subscription's
          # first messages back for a while, and hand them over here.
          zig build example-publish -- orders 2
          zig build example-worker -- orders orders-worker --confirm | tee "$RUNNER_TEMP/confirm.log"
          test "$(grep -c ': taken$' "$RUNNER_TEMP/confirm.log")" -ge 2
          # No emulator in this one: the library's own in-memory Pub/Sub.
          zig build example-in_memory -- 300
          # A file up and back down through gcs_cp, byte for byte, in
          # chunks; up again through uploadParallel, which the emulator
          # takes as one ordinary upload, and down in three 32 MiB ranges
          # through downloadParallel; then refused overwrites, plain and
          # parallel, and a create-only parallel upload of a new name; and
          # a round trip with --resume, whose state files are gone once the
          # copies are done.
          curl -sf -X POST "http://127.0.0.1:4443/storage/v1/b?project=test" \
            -H "Content-Type: application/json" -d '{"name":"zigps-examples"}' >/dev/null
          head -c 75497472 /dev/urandom > "$RUNNER_TEMP/src.bin"
          zig build example-gcs_cp -- "$RUNNER_TEMP/src.bin" gs://zigps-examples/dir/copy.bin
          zig build example-gcs_cp -- gs://zigps-examples/dir/copy.bin "$RUNNER_TEMP/back.bin"
          cmp "$RUNNER_TEMP/src.bin" "$RUNNER_TEMP/back.bin"
          zig build example-gcs_cp -- "$RUNNER_TEMP/src.bin" gs://zigps-examples/dir/parallel.bin --parallel 4
          zig build example-gcs_cp -- gs://zigps-examples/dir/parallel.bin "$RUNNER_TEMP/back-parallel.bin" --parallel 4
          cmp "$RUNNER_TEMP/src.bin" "$RUNNER_TEMP/back-parallel.bin"
          if zig build example-gcs_cp -- "$RUNNER_TEMP/src.bin" gs://zigps-examples/dir/copy.bin --no-clobber; then
            echo "--no-clobber replaced an existing object"
            exit 1
          fi
          if zig build example-gcs_cp -- "$RUNNER_TEMP/src.bin" gs://zigps-examples/dir/copy.bin --no-clobber --parallel 4; then
            echo "--no-clobber --parallel replaced an existing object"
            exit 1
          fi
          zig build example-gcs_cp -- "$RUNNER_TEMP/src.bin" gs://zigps-examples/dir/created.bin --no-clobber --parallel 4
          zig build example-gcs_cp -- "$RUNNER_TEMP/src.bin" gs://zigps-examples/dir/resumed.bin --resume "$RUNNER_TEMP/up.state"
          zig build example-gcs_cp -- gs://zigps-examples/dir/resumed.bin "$RUNNER_TEMP/back-resumed.bin" --resume "$RUNNER_TEMP/down.state" --parallel 4
          cmp "$RUNNER_TEMP/src.bin" "$RUNNER_TEMP/back-resumed.bin"
          test ! -e "$RUNNER_TEMP/up.state" && test ! -e "$RUNNER_TEMP/down.state"
          # An object stored gzip-compressed: decompressed here, and kept as
          # stored with --no-decompress, in one stream and in ranges, each
          # checked against the stored checksum.
          head -c 3000000 /dev/urandom | base64 > "$RUNNER_TEMP/page.txt"
          gzip -c -n "$RUNNER_TEMP/page.txt" > "$RUNNER_TEMP/page.txt.gz"
          { printf -- '--BB\r\nContent-Type: application/json\r\n\r\n{"name":"dir/page.txt","contentEncoding":"gzip","contentType":"text/plain"}\r\n--BB\r\nContent-Type: text/plain\r\n\r\n'
            cat "$RUNNER_TEMP/page.txt.gz"; printf '\r\n--BB--\r\n'; } > "$RUNNER_TEMP/upload.body"
          curl -sf -X POST "http://127.0.0.1:4443/upload/storage/v1/b/zigps-examples/o?uploadType=multipart" \
            -H "Content-Type: multipart/related; boundary=BB" --data-binary @"$RUNNER_TEMP/upload.body" >/dev/null
          zig build example-gcs_cp -- gs://zigps-examples/dir/page.txt "$RUNNER_TEMP/page-back.txt"
          cmp "$RUNNER_TEMP/page.txt" "$RUNNER_TEMP/page-back.txt"
          zig build example-gcs_cp -- gs://zigps-examples/dir/page.txt "$RUNNER_TEMP/page-back.txt.gz" --no-decompress
          cmp "$RUNNER_TEMP/page.txt.gz" "$RUNNER_TEMP/page-back.txt.gz"
          zig build example-gcs_cp -- gs://zigps-examples/dir/page.txt "$RUNNER_TEMP/page-ranges.txt.gz" --no-decompress --parallel 4
          cmp "$RUNNER_TEMP/page.txt.gz" "$RUNNER_TEMP/page-ranges.txt.gz"
          # Compressed on the way up with -z: the object holds gzip that the
          # system's gzip reads back, and comes down decompressed. A name -z
          # does not list goes up as it is. -Z compresses whatever the name,
          # with --resume, whose state is gone once the copy is done.
          zig build example-gcs_cp -- "$RUNNER_TEMP/page.txt" gs://zigps-examples/dir/zipped.txt -z log,txt
          zig build example-gcs_cp -- gs://zigps-examples/dir/zipped.txt "$RUNNER_TEMP/zipped-back.txt"
          cmp "$RUNNER_TEMP/page.txt" "$RUNNER_TEMP/zipped-back.txt"
          zig build example-gcs_cp -- gs://zigps-examples/dir/zipped.txt "$RUNNER_TEMP/zipped-back.txt.gz" --no-decompress
          gzip -dc "$RUNNER_TEMP/zipped-back.txt.gz" | cmp - "$RUNNER_TEMP/page.txt"
          zig build example-gcs_cp -- "$RUNNER_TEMP/page.txt" gs://zigps-examples/dir/unzipped.txt -z log
          zig build example-gcs_cp -- gs://zigps-examples/dir/unzipped.txt "$RUNNER_TEMP/unzipped-back.txt" --no-decompress
          cmp "$RUNNER_TEMP/page.txt" "$RUNNER_TEMP/unzipped-back.txt"
          zig build example-gcs_cp -- "$RUNNER_TEMP/src.bin" gs://zigps-examples/dir/zipped.bin -Z --resume "$RUNNER_TEMP/zip.state"
          zig build example-gcs_cp -- gs://zigps-examples/dir/zipped.bin "$RUNNER_TEMP/zipped-back.bin"
          cmp "$RUNNER_TEMP/src.bin" "$RUNNER_TEMP/zipped-back.bin"
          test ! -e "$RUNNER_TEMP/zip.state"
          # Under a customer-supplied key read from a file, and billed to a
          # project: the emulator takes both and checks neither, so this
          # checks that they travel. A file that holds no key is refused.
          head -c 32 /dev/urandom | base64 > "$RUNNER_TEMP/key.b64"
          zig build example-gcs_cp -- "$RUNNER_TEMP/src.bin" gs://zigps-examples/dir/keyed.bin --encryption-key-file "$RUNNER_TEMP/key.b64" --billing-project test --parallel 4
          zig build example-gcs_cp -- gs://zigps-examples/dir/keyed.bin "$RUNNER_TEMP/back-keyed.bin" --encryption-key-file "$RUNNER_TEMP/key.b64" --billing-project test
          cmp "$RUNNER_TEMP/src.bin" "$RUNNER_TEMP/back-keyed.bin"
          zig build example-gcs_cp -- "$RUNNER_TEMP/page.txt" gs://zigps-examples/dir/kms.txt --kms-key projects/p/locations/us/keyRings/r/cryptoKeys/k
          if zig build example-gcs_cp -- "$RUNNER_TEMP/page.txt" gs://zigps-examples/dir/bad-key.txt --encryption-key-file "$RUNNER_TEMP/page.txt"; then
            echo "--encryption-key-file took a file that holds no key"
            exit 1
          fi
          # An HMAC key signs with no credentials at all. The emulator
          # checks no signature, so this checks the URL is made, names the
          # HMAC algorithm, and fetches the object. The key is made up.
          url=$(GCS_HMAC_ACCESS_ID=GOOG1E-TEST-ONLY GCS_HMAC_SECRET=TEST_ONLY_not_a_real_secret_000000000000 \
            zig build example-gcs_sign -- gs://zigps-examples/dir/copy.bin | sed -n "s/^curl '\(.*\)'$/\1/p")
          case "$url" in *X-Goog-Algorithm=GOOG4-HMAC-SHA256*) ;; *) echo "gcs_sign made no HMAC-signed URL"; exit 1 ;; esac
          curl -sf "$url" -o "$RUNNER_TEMP/hmac.bin"
          cmp "$RUNNER_TEMP/src.bin" "$RUNNER_TEMP/hmac.bin"
          # A bucket's notifications: gcs_notify sets them up, an upload
          # under the prefix reaches the Pub/Sub emulator through
          # fake-gcs-server, and gcs_notify watch prints it, decoded.
          curl -sf -X POST "http://127.0.0.1:4443/storage/v1/b?project=test" \
            -H "Content-Type: application/json" -d '{"name":"zigps-notify"}' >/dev/null
          zig build example-gcs_notify -- setup zigps-notify test zigps-uploads --prefix incoming/
          printf 'hello notifications\n' > "$RUNNER_TEMP/notify.txt"
          zig build example-gcs_cp -- "$RUNNER_TEMP/notify.txt" gs://zigps-notify/incoming/hello.txt
          timeout 120 zig build example-gcs_notify -- watch test zigps-uploads-watch --count 1 | tee "$RUNNER_TEMP/notify.log"
          grep -q "finalize gs://zigps-notify/incoming/hello.txt" "$RUNNER_TEMP/notify.log"
          # Documents through the firestore example: written, changed in
          # part, listed, read back, and deleted, which a read then misses.
          zig build example-firestore -- set cities/LA "name=Los Angeles" population=3900000 nickname=LA
          zig build example-firestore -- update cities/LA population=4000000 --delete nickname
          zig build example-firestore -- set cities/LA/landmarks/tower height=300.5
          zig build example-firestore -- get cities/LA | tee "$RUNNER_TEMP/firestore.log"
          grep -q "population: 4000000" "$RUNNER_TEMP/firestore.log"
          if grep -q nickname "$RUNNER_TEMP/firestore.log"; then
            echo "update kept a field it was told to delete"
            exit 1
          fi
          zig build example-firestore -- collections cities/LA | grep -qx landmarks
          # A counter: an increment on the server, twice, and a read of two
          # documents at once, one of them missing.
          zig build example-firestore -- incr cities/LA visits 2
          zig build example-firestore -- incr cities/LA visits 3 | grep -qx "visits is now 5"
          zig build example-firestore -- getall cities/LA cities/NOPE | tee "$RUNNER_TEMP/getall.log"
          grep -q "visits: 5" "$RUNNER_TEMP/getall.log"
          grep -qx "cities/NOPE: missing" "$RUNNER_TEMP/getall.log"
          # Queries: the biggest two of three cities, and a count by state.
          zig build example-firestore -- set cities/SF state=CA population=870000
          zig build example-firestore -- set cities/NY state=NY population=8300000
          zig build example-firestore -- update cities/LA state=CA
          zig build example-firestore -- query cities population '>' 0 --order population:desc --limit 2 | tee "$RUNNER_TEMP/query.log"
          test "$(grep -c '^cities/' "$RUNNER_TEMP/query.log")" = 2
          head -1 "$RUNNER_TEMP/query.log" | grep -qx "cities/NY"
          zig build example-firestore -- count cities state == CA | grep -qx 2
          # A transaction: 25 moved, then a move of more than is left refused.
          zig build example-firestore -- set accounts/alice balance=100
          zig build example-firestore -- transfer accounts/alice accounts/bob balance 25 | grep -qx "moved 25: accounts/alice now holds 75, accounts/bob 25"
          if zig build example-firestore -- transfer accounts/alice accounts/bob balance 500; then
            echo "transfer moved more than there was"
            exit 1
          fi
          zig build example-firestore -- get accounts/bob | grep -q "balance: 25"
          zig build example-firestore -- rm cities/LA
          if zig build example-firestore -- get cities/LA; then
            echo "rm left the document"
            exit 1
          fi

  # The unit tests with the optimizer on. Bugs that depend on it, such as a
  # read of undefined memory, can pass in Debug and fail here. `test-unit`
  # leaves out the examples and the server suites, which the test job
  # compiles in Debug: optimized, they took most of this job's time. Even
  # so, compiling takes nearly all of it: ReleaseFast ran up to 19 minutes
  # in November 2026, so the job has 30.
  release:
    strategy:
      fail-fast: false
      matrix:
        optimize: [ReleaseSafe, ReleaseFast]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
          # One cache per mode: under one key the two legs raced to save it.
          cache-key: ${{ matrix.optimize }}

      - name: Unit, property and fuzz-corpus tests
        env:
          OPTIMIZE: ${{ matrix.optimize }}
        run: zig build test-unit "-Doptimize=$OPTIMIZE" --summary all

  # The unit tests on macOS and Windows. The integration tests need the
  # emulator's container, which only the Linux runners have.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - uses: ./.github/actions/vet-tools

      - name: Unit, property and fuzz-corpus tests
        run: zig build test --summary all

  # Line coverage of the unit tests. Debian packages kcov and the Ubuntu 24.04
  # runners do not, so this job runs in a Debian container.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # debian:trixie-slim; `docker buildx imagetools inspect` gives a newer digest.
      image: debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
      # kcov turns off address-space randomization for the process it traces,
      # which Docker's default seccomp profile forbids.
      options: --security-opt seccomp=unconfined
    steps:
      - name: Install kcov
        run: |
          apt-get update
          apt-get install -y --no-install-recommends kcov python3 ca-certificates git xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Measure coverage
        run: zig build coverage

      - name: Summarize
        run: python3 tools/coverage_summary.py zig-out/coverage >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: zig-out/coverage

  # One job per module, so each gets its own 180 minutes: `--fuzz=N` runs
  # every property N times, and they outgrew a single job. The counts come
  # from per-property costs measured on 2026-09-21. core, pubsub and
  # secret_manager take well under a millisecond a run. auth's properties
  # build providers and parse keys, about 10 ms for a pass over all of
  # them, and the one that signs a JWT with RSA on every run takes 49 ms on
  # its own. That one is named "slow property" rather than "fuzz", so the
  # auth job skips it, and it gets a job of its own at a count it can
  # finish. pubsub's Publisher property plays a whole script against a
  # publisher and costs about 1.4 ms a run, more than the rest of pubsub's
  # together, so it is a slow property too, and so are the two signed URL
  # properties in storage that build whole requests. A manual run's
  # fuzz_iterations overrides every count.
  fuzz:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fuzz_iterations != '')
    name: fuzz (${{ matrix.job }})
    strategy:
      fail-fast: false
      matrix:
        # `--fuzz=N` runs every matching property N times, so a job takes N
        # times the sum of its properties' costs per run. Since 2026-11-07
        # each count is about a ninth of the one that sized its job to 90
        # minutes, so a job takes about 10: the nightly keeps every property
        # fuzzed and its corpus fresh, and is not where long campaigns run.
        # The counts' history, from the CI timings that set them, is in git
        # (this comment as of ecf4700). A job's cost moves from night to
        # night as its corpus grows, by up to three times at one count, so
        # the timeouts below are the margin.
        include:
          - { job: core, module: core, filter: fuzz, iterations: 70K }
          - { job: auth, module: auth, filter: fuzz, iterations: 94K }
          - { job: slow-auth, module: auth, filter: slow property, iterations: 7K }
          - { job: pubsub, module: pubsub, filter: fuzz, iterations: 110K }
          - { job: slow-pubsub, module: pubsub, filter: slow property Publisher, iterations: 210K }
          - { job: slow-subscriber, module: pubsub, filter: slow property Subscriber, iterations: 5K }
          - { job: heavy-pubsub, module: pubsub, filter: heavy property, iterations: 780K }
          - { job: fake-pubsub, module: pubsub, filter: fake property, iterations: 72K }
          - { job: secret_manager, module: secret_manager, filter: fuzz, iterations: 570K }
          - { job: heavy-secret_manager, module: secret_manager, filter: heavy property, iterations: 12K }
          - { job: storage, module: storage, filter: fuzz, iterations: 120K }
          - { job: slow-storage, module: storage, filter: slow property, iterations: 470K }
          - { job: fake-storage, module: storage, filter: fake property, iterations: 130K }
          - { job: heavy-storage, module: storage, filter: heavy property, iterations: 2K }
          - { job: fault-storage, module: storage, filter: fault property parallel|fault property uploadFile resume, iterations: 6K }
          - { job: fault-gzip, module: storage, filter: fault property gzip|fault property compressed, iterations: 17 }
          - { job: firestore, module: firestore, filter: fuzz, iterations: 220K }
          - { job: heavy-firestore, module: firestore, filter: heavy property, iterations: 140K }
          - { job: logging, module: logging, filter: fuzz, iterations: 220K }
          - { job: slow-logging, module: logging, filter: slow property, iterations: 10K }
          - { job: resource_manager, module: resource_manager, filter: fuzz, iterations: 220K }
          - { job: slow-resource_manager, module: resource_manager, filter: slow property, iterations: 220K }
          - { job: error_reporting, module: error_reporting, filter: fuzz, iterations: 280K }
          - { job: monitoring, module: monitoring, filter: fuzz, iterations: 220K }
          - { job: slow-monitoring, module: monitoring, filter: slow property, iterations: 220K }
          - { job: kms, module: kms, filter: fuzz, iterations: 220K }
          - { job: slow-kms, module: kms, filter: slow property, iterations: 33K }
          - { job: scheduler, module: scheduler, filter: fuzz, iterations: 1100K }
          - { job: slow-scheduler, module: scheduler, filter: slow property, iterations: 440K }
          - { job: run, module: run, filter: fuzz, iterations: 670K }
          - { job: slow-run, module: run, filter: slow property, iterations: 130K }
          - { job: dataflow, module: dataflow, filter: fuzz, iterations: 890K }
          - { job: slow-dataflow, module: dataflow, filter: slow property, iterations: 440K }
          - { job: bigquery, module: bigquery, filter: fuzz, iterations: 670K }
          - { job: slow-bigquery, module: bigquery, filter: slow property, iterations: 160K }
          - { job: datatransfer, module: datatransfer, filter: fuzz, iterations: 890K }
          - { job: compute, module: compute, filter: fuzz, iterations: 78K }
          - { job: slow-compute, module: compute, filter: slow property, iterations: 28K }
          - { job: billing, module: billing, filter: fuzz, iterations: 220K }
          - { job: service_usage, module: service_usage, filter: fuzz, iterations: 280K }
          - { job: slow-datatransfer, module: datatransfer, filter: slow property, iterations: 160K }
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # actions: read finds and downloads the corpus an earlier run kept.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      # Each run starts from the corpus the earlier runs built up, kept as
      # an artifact rather than in the cache. On a busy day the build caches
      # of every run fill the cache's 10 GB, and it evicts the least recently
      # used entry first: the corpus, read once a night. The nightlies
      # found none on 8 of the 11 nights from 2026-09-23 to 10-03. The
      # newest corpus from this branch or main is the one restored, as
      # with the cache.
      - name: Restore the fuzz corpus
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: fuzz-corpus-${{ matrix.job }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -o pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" --jq '
            [.artifacts[] | select(.expired | not)
              | select(.workflow_run.head_branch == env.BRANCH or .workflow_run.head_branch == "main")]
            | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "No $NAME artifact yet: this run starts from the seed corpus alone"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/corpus.zip"
          mkdir -p .zig-cache/f
          unzip -q -o "$RUNNER_TEMP/corpus.zip" -d .zig-cache/f
          echo "Restored artifact $id: $(find .zig-cache/f -type f | wc -l) files"

      - uses: ./.github/actions/vet-tools

      # Its own limit, below the job's: a fuzzer that stalls is still
      # running when this step ends, and the job's last minutes are for the
      # step below that asks it where it is stuck. The counts aim at about
      # 10 minutes, and one night can cost three times another.
      - name: Coverage-guided fuzzing
        timeout-minutes: 25
        env:
          ITERATIONS: ${{ inputs.fuzz_iterations || matrix.iterations }}
          MODULE: ${{ matrix.module }}
          FILTER: ${{ matrix.filter }}
          JOB: ${{ matrix.job }}
        run: |
          set -o pipefail
          # A failing input saved by an earlier run is not this run's.
          rm -f .zig-cache/f/crash
          # A filter of several names, separated by |, runs each of them.
          filters=()
          IFS='|' read -ra parts <<< "$FILTER"
          for f in "${parts[@]}"; do filters+=("-Dtest-filter=$f"); done
          zig build test -Dfuzz-runner "-Dmodule=$MODULE" "${filters[@]}" "--fuzz=$ITERATIONS" 2>&1 | tee "$RUNNER_TEMP/fuzz.log"
          # A test that fails or crashes while being fuzzed does not fail
          # zig build, which still exits 0: the input it saves, and the line
          # that reports it, are the only signs. Either one fails the job.
          if [ -e .zig-cache/f/crash ] || grep -q "input saved to" "$RUNNER_TEMP/fuzz.log"; then
            echo "::error::a fuzz test failed while being fuzzed; its input is attached as fuzz-failure-$JOB"
            exit 1
          fi

      # On 2026-10-28 and 11-01 the Subscriber property stalled: the job
      # sat silent until its timeout, and its test process was still alive
      # at the job's cleanup. A step that runs out of time leaves the build
      # runner and the test processes it started running, so each thread's
      # stack, and the input each fuzzer was on, say where they are stuck.
      # Every process running from this workspace's Zig cache is ours: the
      # build runner and the test binaries it built. A failure with nothing
      # left running (a crash the fuzzer caught) has nothing to dump.
      - name: Dump the stacks of a fuzzer still running
        if: failure() || cancelled()
        timeout-minutes: 15
        run: |
          set -u
          out=.zig-cache/tmp/fuzz-stacks.txt
          mkdir -p .zig-cache/tmp
          pids=()
          for exe in /proc/[0-9]*/exe; do
            target=$(readlink "$exe" 2>/dev/null) || continue
            case "$target" in
              "$GITHUB_WORKSPACE"/.zig-cache/*) pid=${exe#/proc/}; pids+=("${pid%/exe}") ;;
            esac
          done
          if [ ${#pids[@]} -eq 0 ]; then
            echo "Nothing from the Zig cache is still running."
            exit 0
          fi
          command -v gdb > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gdb > /dev/null; }
          # An in<N> file is a fuzzer's current input: a 20-byte header
          # (u64 pc digest, then u32 instance, test index and length), then
          # the input. The test index counts the fuzz tests the filter kept.
          for f in .zig-cache/f/in*; do
            if [ -e "$f" ]; then
              echo "$f: instance, test index, length:$(od -A n -t u4 -j 8 -N 12 "$f" | tr -s " ")"
            fi
          done | tee -a "$out"
          for pid in "${pids[@]}"; do
            {
              echo "=== pid $pid: $(tr '\0' ' ' < "/proc/$pid/cmdline")"
              # Yama lets only root attach to a process it did not start.
              sudo timeout 300 gdb -p "$pid" -batch -nx \
                -ex 'set pagination off' -ex 'info threads' -ex 'thread apply all bt'
            } 2>&1 | tee -a "$out"
          done

      # 30 days, so a corpus outlasts a few nights without a run.
      - name: Save the fuzz corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.job }}
          path: .zig-cache/f
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      # `crash` is the failing input: a 4-byte little-endian length, then the
      # bytes. CONTRIBUTING.md says how to turn it into a regression test.
      # A fuzzer that stalled leaves no crash, but its in<N> file holds the
      # input it was on, and fuzz-stacks.txt what each thread was doing.
      - name: Keep the failing input
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.job }}
          path: |
            .zig-cache/f/crash
            .zig-cache/f/in*
            .zig-cache/tmp/libfuzzer.log
            .zig-cache/tmp/fuzz-stacks.txt
          include-hidden-files: true
          if-no-files-found: ignore
